<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor - Vistoria Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-main: #f4f7fb;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #0a56d1;
            
            --step1-bg: #e0e7ff; --step1-txt: #3730a3; --step1-border: #4f46e5;
            --step2-bg: #ccfbf1; --step2-txt: #0f766e; --step2-border: #0d9488;
            --radius-lg: 16px; --radius-md: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-main);
            color: var(--text-dark); margin: 0; padding: 24px; display: flex; flex-direction: column; align-items: center;
        }

        * { box-sizing: border-box; }

        .container { max-width: 900px; width: 100%; display: flex; flex-direction: column; gap: 24px; }

        .page-header h1 { font-family: 'Outfit', sans-serif; font-size: 32px; margin: 0 0 8px 0; color: var(--text-dark); }
        .page-header p { margin: 0; color: var(--text-muted); font-size: 15px; }

        /* CARDS (STEPS) */
        .section-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: 30px;
            box-shadow: var(--shadow-sm); position: relative; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 20px;
        }
        .section-card.step-1 { border-left: 4px solid var(--step1-border); }
        .section-card.step-2 { border-left: 4px solid var(--step2-border); }

        .section-title {
            display: flex; align-items: center; gap: 12px; font-family: 'Outfit', sans-serif;
            font-size: 20px; font-weight: 700; color: var(--text-dark); margin: 0 0 10px 0;
        }

        .step-badge {
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; font-weight: 800;
        }
        .step-1 .step-badge { background: var(--step1-bg); color: var(--step1-txt); }
        .step-2 .step-badge { background: var(--step2-bg); color: var(--step2-txt); }

        /* FORMS */
        .form-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .form-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-input, .form-select {
            padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); 
            font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-dark); outline: none; width: 100%;
        }
        .form-input:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10, 86, 209, 0.1); }

        /* CHIPS ESCOLAS */
        .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip { background: #e2e8f0; color: var(--text-dark); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .chip .remove { cursor: pointer; font-weight: bold; color: var(--text-muted); }
        .chip .remove:hover { color: var(--red); }

        /* OPÇÕES CARDS (Radios e Checkboxes) */
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .option-card {
            border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; cursor: pointer; transition: 0.2s; 
            display: flex; align-items: flex-start; gap: 12px; background: #ffffff; user-select: none;
        }
        .option-card:hover { border-color: var(--primary); background: #f8fafc; }
        .option-card input { margin-top: 4px; accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer;}
        .option-content { display: flex; flex-direction: column; gap: 4px; }
        .option-title { font-size: 14px; font-weight: 600; color: var(--text-dark); }
        .option-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

        .option-card.selected { border-color: var(--step2-border); background: var(--step2-bg); }
        .option-card.selected .option-title { color: var(--step2-txt); }

        .btn-submit {
            background-color: var(--primary); color: white; border: none; padding: 16px 32px; 
            border-radius: var(--radius-md); font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; width: 100%;
        }
        .btn-submit:hover { background-color: #0842a0; transform: translateY(-2px); }

        #loadingOverlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 50; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: var(--primary);
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div style="text-align: center;">
            <span class="material-symbols-outlined" style="font-size: 40px; animation: spin 1s linear infinite;">sync</span>
            <p>Carregando Base de Dados...</p>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Vistoria Escolar</h1>
            <p>Registre a visita e envie direto para a planilha.</p>
        </div>

        <!-- PASSO 1 -->
        <div class="section-card step-1">
            <div class="section-title">
                <div class="step-badge">1</div> Informações Principais
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Supervisor(a)</label>
                    <select class="form-select" id="inpSupervisor">
                        <option value="">Selecione o Supervisor...</option>
                        <!-- Preenchido pelo Banco -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Data da Visita</label>
                    <input type="date" class="form-input" id="inpData">
                </div>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label class="form-label">Escola(s)</label>
                <div style="position: relative;">
                    <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 20px;">search</span>
                    <input type="text" class="form-input" id="searchEscola" placeholder="Buscar escola..." style="padding-left: 42px;" autocomplete="off">
                    <div id="listaSugestoes" style="display:none; position:absolute; top:100%; left:0; right:0; background:white; border:1px solid var(--border); border-radius:8px; max-height:200px; overflow-y:auto; z-index:10;"></div>
                </div>
                <div class="chips-container" id="chipsEscola"></div>
            </div>
        </div>

        <!-- PASSO 2 -->
        <div class="section-card step-2">
            <div class="section-title">
                <div class="step-badge">2</div> Detalhes da Visita
            </div>

            <div class="form-group">
                <label class="form-label">Tipo de Visita</label>
                <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
                    <label class="option-card selected">
                        <input type="radio" name="tipoVisita" value="Acompanhamento" checked onchange="atualizarEstiloRadios(this)">
                        <div class="option-content">
                            <span class="option-title">Acompanhamento</span>
                            <span class="option-desc">Visitas do Kanban.</span>
                        </div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="tipoVisita" value="Registro Extra" onchange="atualizarEstiloRadios(this)">
                        <div class="option-content">
                            <span class="option-title">Outro Registro</span>
                            <span class="option-desc">Visitas Extras.</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label class="form-label">Ações Realizadas (Filtre ou Selecione)</label>
                <div style="position: relative; margin-bottom: 12px;">
                    <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 20px;">search</span>
                    <input type="text" class="form-input" id="searchAcao" placeholder="Pesquisar ação..." style="padding-left: 42px;" autocomplete="off" oninput="filtrarAcoes()">
                </div>
                
                <!-- AQUI ENTRA A LISTA DO BANCO DE DADOS -->
                <div class="options-grid" id="gridAcoes" style="max-height: 350px; overflow-y: auto; padding-right: 5px;">
                    <!-- Checkboxes dinâmicos gerados via JS -->
                </div>
            </div>
        </div>

        <button class="btn-submit" onclick="enviarFormulario()" id="btnSubmit">
            <span class="material-symbols-outlined">send</span> Finalizar e Enviar
        </button>

    </div>

    <!-- LOGICA FIREBASE E INTEGRAÇÃO GOOGLE SHEETS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Substitua APENAS o SCRIPT_URL pela sua nova URL gerada no Passo 1
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymq_CP20Qcnp558XV_21FpyrdpYNV12bE9T4MMwvvMYkorgjknw66oJaTjjeR6RGHj/exec';

        const firebaseConfig = {
            apiKey: "AIzaSyDs12xgOEPIKu7pNjftNUThM0_-Z0BwoLY",
            authDomain: "projetoure.firebaseapp.com",
            projectId: "projetoure",
            storageBucket: "projetoure.firebasestorage.app",
            messagingSenderId: "114345231736",
            appId: "1:114345231736:web:21d610c85bc9843ac4748d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let userEmail = "";
        let todasAsEscolas = [];
        let escolasSelecionadas = [];
        let listaAcoesBanco = [];

        // 1. AUTHENTICATION
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userEmail = user.email;
                carregarBanco();
            } else {
                alert("Você precisa estar logado no Portal.");
                window.location.href = "index.html";
            }
        });

        // 2. BUSCA AS INFORMAÇÕES DO GOOGLE SHEETS (Supervisores, Escolas, AÇÕES DA PLANILHA)
        function carregarBanco() {
            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(dados => {
                let supers = new Set();
                let escolas = new Set();
                
                if(dados.vistorias) {
                    dados.vistorias.forEach(v => {
                        if(v.Supervisor) supers.add(v.Supervisor);
                        if(v.Escola) escolas.add(v.Escola);
                    });
                }
                
                // Popula o Dropdown de Supervisor
                const supSelect = document.getElementById('inpSupervisor');
                [...supers].sort().forEach(s => supSelect.innerHTML += `<option value="${s}">${s}</option>`);

                // Guarda as escolas para o Autocomplete
                todasAsEscolas = [...escolas].sort();

                // 🌟 NOVIDADE: PEGA AS AÇÕES DO BANCO DE DADOS
                if(dados.acoes) {
                    listaAcoesBanco = dados.acoes;
                    renderizarAcoes(listaAcoesBanco);
                }

                // Ajusta Data para o dia de hoje
                document.getElementById('inpData').valueAsDate = new Date();
                
                document.getElementById('loadingOverlay').style.display = 'none';
            })
            .catch(err => {
                alert("Erro de conexão com o banco de dados.");
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }

        // 3. RENDERIZA OS CHECKBOXES BASEADOS NO BANCO DE DADOS
        window.renderizarAcoes = function(listaFiltrada) {
            const grid = document.getElementById('gridAcoes');
            grid.innerHTML = '';
            
            listaFiltrada.forEach((acao, index) => {
                grid.innerHTML += `
                    <label class="option-card" id="lbl_acao_${index}">
                        <input type="checkbox" name="acoesForm" value="${acao}" onchange="atualizarEstiloCheckbox(this)">
                        <div class="option-content">
                            <span class="option-title" style="font-size:12px;">${acao}</span>
                        </div>
                    </label>
                `;
            });
        }

        window.filtrarAcoes = function() {
            const termo = document.getElementById('searchAcao').value.toLowerCase();
            const filtradas = listaAcoesBanco.filter(a => a.toLowerCase().includes(termo));
            renderizarAcoes(filtradas);
            
            // Re-aplicar estilo nas marcadas
            document.querySelectorAll('input[name="acoesForm"]:checked').forEach(inp => {
                inp.closest('.option-card').classList.add('selected');
            });
        }

        window.atualizarEstiloRadios = function(radio) {
            document.querySelectorAll('input[name="tipoVisita"]').forEach(r => {
                r.closest('.option-card').classList.remove('selected');
            });
            radio.closest('.option-card').classList.add('selected');
        }

        window.atualizarEstiloCheckbox = function(checkbox) {
            if(checkbox.checked) checkbox.closest('.option-card').classList.add('selected');
            else checkbox.closest('.option-card').classList.remove('selected');
        }

        // 4. LÓGICA DO AUTOCOMPLETE DAS ESCOLAS
        const inputEscola = document.getElementById('searchEscola');
        const listaSugestoes = document.getElementById('listaSugestoes');
        
        inputEscola.addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            listaSugestoes.innerHTML = '';
            if(!termo) { listaSugestoes.style.display = 'none'; return; }

            const filtradas = todasAsEscolas.filter(esc => esc.toLowerCase().includes(termo) && !escolasSelecionadas.includes(esc));
            if(filtradas.length === 0) { listaSugestoes.style.display = 'none'; return; }

            filtradas.forEach(esc => {
                let div = document.createElement('div');
                div.style.padding = '10px 16px'; div.style.cursor = 'pointer'; div.style.borderBottom = '1px solid #eee';
                div.innerText = esc;
                div.onclick = () => { adicionarEscolaChip(esc); inputEscola.value = ''; listaSugestoes.style.display = 'none'; };
                listaSugestoes.appendChild(div);
            });
            listaSugestoes.style.display = 'block';
        });

        function adicionarEscolaChip(nome) {
            escolasSelecionadas.push(nome);
            renderizarChips();
        }

        window.removerEscolaChip = function(nome) {
            escolasSelecionadas = escolasSelecionadas.filter(e => e !== nome);
            renderizarChips();
        }

        function renderizarChips() {
            const container = document.getElementById('chipsEscola');
            container.innerHTML = '';
            escolasSelecionadas.forEach(esc => {
                container.innerHTML += `
                    <div class="chip">
                        ${esc} <span class="remove" onclick="removerEscolaChip('${esc}')">✕</span>
                    </div>
                `;
            });
        }

        document.addEventListener('click', (e) => {
            if(e.target !== inputEscola) listaSugestoes.style.display = 'none';
        });

        // 5. ENVIO DOS DADOS (POST NO GOOGLE SHEETS)
        window.enviarFormulario = function() {
            const supervisor = document.getElementById('inpSupervisor').value;
            let dObj = document.getElementById('inpData').valueAsDate;
            let dataStr = dObj ? `${String(dObj.getDate() + 1).padStart(2,'0')}/${String(dObj.getMonth() + 1).padStart(2,'0')}/${dObj.getFullYear()}` : "";
            const tipo = document.querySelector('input[name="tipoVisita"]:checked').value;
            
            // Pega checkboxes marcados
            const acoesMarcadasEls = document.querySelectorAll('input[name="acoesForm"]:checked');
            const acoes = Array.from(acoesMarcadasEls).map(el => el.value).join(' | ');

            if(!supervisor) return alert("Selecione o Supervisor.");
            if(!dataStr) return alert("Selecione a Data.");
            if(escolasSelecionadas.length === 0) return alert("Adicione pelo menos uma Escola.");
            if(!acoes) return alert("Selecione pelo menos uma Ação.");

            document.getElementById('loadingOverlay').style.display = 'flex';
            document.querySelector('#loadingOverlay p').innerText = "Enviando relatório...";

            const payload = {
                supervisor: supervisor,
                dataVisita: dataStr,
                escola: escolasSelecionadas.join(' | '),
                tipoOrigem: tipo,
                acoes: acoes,
                status: "Realizada",
                email: userEmail
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(resp => {
                if(resp.status === "success") {
                    alert("Relatório salvo com sucesso no banco de dados!");
                    window.location.reload();
                } else {
                    alert("Erro ao salvar: " + resp.message);
                }
            })
            .catch(err => alert("Erro na requisição."));
        }
    </script>
</body>
</html>
